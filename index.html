<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>위인 그림책</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>

/* 레이아웃: 첫 화면은 책장, 책을 고르면 그림 한 장 + 문장 + 큰 넘김 버튼 */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9F0EB; --surface:#FFFFFF; --ink:#1F2A44; --muted:#596476;
  --accent:#C8433A; --gold:#E2A93B; --line:#C7D4CC; --chip:#F4E7C6; --chip-ink:#6A4B12;
  --font-d:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-b:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141B26; --surface:#1E2837; --ink:#EEF0E8; --muted:#A9B2C0;
  --accent:#EE6E63; --gold:#EAB858; --line:#2F3B4E; --chip:#3B3220; --chip-ink:#F2D594; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141B26; --surface:#1E2837; --ink:#EEF0E8; --muted:#A9B2C0;
  --accent:#EE6E63; --gold:#EAB858; --line:#2F3B4E; --chip:#3B3220; --chip-ink:#F2D594; color-scheme:dark}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;font-size:14px;background:var(--bg);color:var(--ink);font-family:var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:600px;margin:0 auto;padding-block:12px 28px}
.book,.shelf{display:flex;flex-direction:column;gap:14px}
.shelf h1{font-family:var(--font-d);font-weight:400;font-size:28px;margin:4px 0 0;text-wrap:balance}
.shelf .lead{margin:0;font-size:17px;line-height:1.6;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bookcard{display:flex;flex-direction:column;gap:6px;padding:0;background:none;border:0;text-align:left;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.bookcard .cv{border:3px solid var(--ink);border-radius:14px;overflow:hidden;aspect-ratio:400/280;background:#fff;max-width:100%}
.bookcard .cv svg{display:block;width:100%;height:100%}
.bookcard .no{font-family:var(--font-d);font-size:14px;color:var(--accent)}
.bookcard .tt{font-family:var(--font-d);font-size:18px;line-height:1.3;word-break:keep-all}
.bookcard.soon{cursor:default}
.bookcard.soon .cv{border:3px dashed var(--line);background:transparent;display:grid;place-items:center;color:var(--muted);font-family:var(--font-d);font-size:16px}
.progress{margin:0;font-family:var(--font-d);font-size:17px;color:var(--accent)}
.era{display:flex;flex-direction:column;gap:12px;padding-left:18px;border-left:4px solid var(--line);margin-left:9px;padding-bottom:18px}
.era h2{font-family:var(--font-d);font-weight:400;font-size:22px;margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;position:relative}
.era h2 i{position:absolute;left:-31px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--gold);border:3px solid var(--ink)}
.era h2 small{font-size:15px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bookcard .cv{position:relative}
.sticker{position:absolute;right:6px;top:4px;font-size:30px;line-height:1;color:var(--gold);text-shadow:0 0 0 #000,0 1px 0 #6A4B12,1px 0 0 #6A4B12,-1px 0 0 #6A4B12,0 -1px 0 #6A4B12}
.allDone .bookcard .cv{box-shadow:0 0 0 3px var(--gold)}
.got{margin:0;font-family:var(--font-d);font-size:20px;color:var(--accent)}
.talkh{font-size:24px}
.stop .when{display:block;min-height:1.4em}
.tappable{cursor:pointer;animation:nudge 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
rect.tappable,.tappable.tapped:not(.hit){animation:none}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.eranav{display:flex;flex-wrap:wrap;gap:8px}
.eranav button{font-family:var(--font-d);font-size:16px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.era{scroll-margin-top:12px}
.stop .who{font-size:12px!important;padding:3px 5px!important;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font-family:var(--font-d);font-weight:400;font-size:20px;margin:0;flex:1 1 auto;min-width:0}
.backbtn{font-family:var(--font-d);font-size:16px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer}
.count{font-family:var(--font-d);font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.auto{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
.auto input{width:20px;height:20px;accent-color:var(--accent)}
.stage{margin:0;border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:#fff;aspect-ratio:400/280;max-width:100%}
.stage svg{display:block;width:100%;height:100%}
.stage.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.35}to{opacity:1}}
.hit{animation:hit .6s ease;transform-box:fill-box;transform-origin:50% 0%}
@keyframes hit{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}45%{transform:rotate(10deg)}70%{transform:rotate(-5deg)}}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--font-d);font-size:14px;background:var(--chip);color:var(--chip-ink);padding:4px 10px;border-radius:999px;letter-spacing:.02em}
.story{font-size:clamp(19px,5.2vw,23px);line-height:1.8;margin:0;text-wrap:pretty;word-break:keep-all}
.story.cover{font-family:var(--font-d);text-align:center}
.story .big{font-size:1.5em;color:var(--accent)}
.tiles{display:flex;gap:10px;flex-wrap:wrap}
.tile{font-family:var(--font-d);font-size:34px;min-width:60px;height:60px;border-radius:14px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;padding:0 12px}
.tile.wide{font-size:20px}
.tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tip{font-size:18px;line-height:1.6;margin:0;min-height:1.6em;color:var(--muted)}
.tip b{color:var(--ink);font-weight:400;font-family:var(--font-d)}
.road{border-top:2px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.road h2,.talk h2{font-family:var(--font-d);font-weight:400;font-size:19px;margin:0}
.path{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;position:relative}
.path::before{content:"";position:absolute;left:6%;right:6%;top:11px;height:4px;background:var(--line);border-radius:2px}
.stop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;min-width:0;line-height:1.35;color:var(--muted);position:relative;word-break:keep-all}
.stop i{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.stop.here i{background:var(--gold);border-color:var(--ink)}
.stop.here{color:var(--ink)}
.stop.now i{background:var(--accent);border-color:var(--accent)}
.stop .whos{display:flex;flex-direction:column;gap:4px;align-items:center}
.stop .who.cur{background:var(--accent);color:#fff}
.stop .who{font-family:var(--font-d);font-size:14px;border:0;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:3px 8px;cursor:pointer}
.talk{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:18px;line-height:1.55}
.card p{margin:0;font-size:17px;line-height:1.6;word-break:keep-all}
.card .age{font-family:var(--font-d);font-size:16px;color:var(--accent)}
.card.next{border-style:dashed}
.card .go{align-self:flex-start;font-family:var(--font-d);font-size:17px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer}
.comps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0}
.comps small{flex-basis:100%;font-size:14px;color:var(--muted)}
.comp{font-family:var(--font-d);font-size:15px;color:#fff;background:var(--c);border-radius:999px;padding:3px 10px}
.find{list-style:none;padding-left:0!important}
.find label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.find input{width:20px;height:20px;margin-top:4px;accent-color:var(--accent);flex:none}
.card .small{font-size:14px;color:var(--muted)}
.did{align-self:center;font-family:var(--font-d);font-size:20px;min-height:54px;border-radius:999px;border:3px solid var(--ink);background:var(--surface);color:var(--ink);padding:0 28px;cursor:pointer}
.did.on{background:var(--gold);border-color:var(--gold);color:#3B2A10}
.comptally{display:flex;flex-direction:column;gap:8px}
.comptally p{margin:0;font-size:16px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px 12px}
.bar{display:flex;flex-direction:column;gap:3px;min-width:0}
.bar b{display:block;height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.bar b::after{content:"";position:absolute;inset:0;width:min(100%,calc(var(--n)*20%));background:var(--c);border-radius:5px}
.bar i{font-style:normal;font-size:13px;color:var(--muted)}
.note{font-size:15px;line-height:1.6;color:var(--muted);margin:0}
.controls{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px}
.btn{font-family:var(--font-d);font-size:20px;min-height:58px;border-radius:16px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;padding:0 8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.btn.speaking{background:var(--gold);border-color:var(--gold);color:#1F2A44}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots button{width:10px;height:10px;border-radius:5px;border:0;padding:0;background:var(--line);cursor:pointer}
.dots button.on{width:24px;background:var(--ink)}

/* 세로 화면 기본값 보강: 단추 글자가 줄바꿈되지 않게, 위 막대 정리 */
.side,.sidebody{display:flex;flex-direction:column;gap:14px;min-width:0}
.top .opts{flex-basis:100%;order:3;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.autobtn{font-family:var(--font-d);font-size:16px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.autobtn.on{background:var(--accent);color:#fff}
.btn{white-space:nowrap;font-size:clamp(16px,4.6vw,20px)}
.top h1{word-break:keep-all;line-height:1.3}
.chip{letter-spacing:0}
.story{letter-spacing:-.005em}

/* 가로 화면: 그림은 왼쪽에 화면 높이만큼, 글과 넘김 단추는 오른쪽 */
@media (orientation:landscape) and (min-width:640px){
  .wrap{max-width:1280px}
  .book:not([hidden]){display:grid;grid-template-columns:auto minmax(260px,1fr);grid-template-rows:auto minmax(0,1fr);
    column-gap:20px;row-gap:10px;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 24px);padding-block:0}
  .wrap:has(#reader:not([hidden])){padding-block:12px}
  .book .top{grid-column:1/-1;flex-wrap:nowrap}
  .top .opts{flex-basis:auto;order:0;flex-wrap:nowrap}
  .top .auto{white-space:nowrap}
  .book .stage{grid-column:1;grid-row:2;align-self:start;height:auto;
    width:min(calc(100vw - 392px),calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 90px)*400/280))}
  .side{grid-column:2;grid-row:2;min-height:0;gap:10px}
  .sidebody{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:4px;gap:12px}
  .story{font-size:clamp(17px,1.1vw + 1.3vh,23px);line-height:1.7}
  .controls{margin-top:auto}
  .stop{font-size:12px}
  .btn{font-size:clamp(15px,1vw + .9vh,20px);min-height:clamp(44px,8vh,58px)}
  .tile{font-size:clamp(22px,2vw + 1vh,34px);min-width:48px;height:clamp(44px,8vh,60px)}
  .tile.wide{font-size:clamp(15px,1vw + .8vh,20px)}
  .tip{font-size:clamp(15px,.8vw + 1vh,18px)}
  /* 그림이 없는 쪽(이야기 나누기, 해 보기)은 가운데 한 단 */
  .book.nostage{grid-template-columns:minmax(0,820px);justify-content:center}
  .book.nostage .side{grid-column:1}
  /* 책장: 넓은 화면에서는 한 줄에 여러 권 */
  .cards{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .shelf .lead{max-width:60ch}
}
/* 휴대폰 가로처럼 낮은 화면: 위 막대와 점을 줄인다 */
@media (orientation:landscape) and (min-width:640px) and (max-height:520px){
  .top h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .backbtn{font-size:14px;padding:4px 10px}
  .count,.auto{font-size:14px}
  .autobtn{font-size:14px;padding:4px 10px}
  .auto input{width:18px;height:18px}
  .book .stage{border-width:2px;border-radius:14px;width:min(58vw,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 70px)*400/280))}
  .book:not([hidden]){row-gap:6px;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 16px)}
  .wrap:has(#reader:not([hidden])){padding-block:8px}
  .story{font-size:17px;line-height:1.6}
  .dots{display:none}
  .controls{gap:6px}
  .btn{border-radius:12px}
}
@media (min-width:640px) and (orientation:portrait){
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){.stage.fade,.hit,.tappable{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <section class="shelf" id="shelf">
    <h1>우리 집 위인 그림책</h1>
    <p class="lead">아주아주 먼 옛날부터 할머니 할아버지 어릴 적까지, 시대 순서대로 꽂혀 있어요. 읽고 싶은 책을 골라 보세요.</p>
    <p class="progress" id="progress"></p>
    <div class="comptally" id="comptally"></div>
    <div id="grid"></div>
  </section>
  <section class="book" id="reader" hidden>
    <div class="top">
      <button class="backbtn" id="back" type="button">← 책장</button>
      <h1 id="btitle"></h1>
      <span class="count" id="count"></span>
      <div class="opts">
        <button class="autobtn" id="autoPlay" type="button" aria-pressed="false">▶ 저절로 읽기</button>
        <label class="auto"><input type="checkbox" id="autoRead"> 넘기면 읽어주기</label>
      </div>
    </div>
    <figure class="stage" id="stage" role="img"></figure>
    <div class="side" id="side">
      <div class="sidebody">
        <div class="meta" id="meta"></div>
        <div id="body"></div>
      </div>
      <div class="controls">
        <button class="btn" id="prev" type="button">← 앞으로</button>
        <button class="btn" id="read" type="button">🔊 읽어주기</button>
        <button class="btn primary" id="next" type="button">넘기기 →</button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </section>
</div>
